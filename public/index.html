<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142A4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Store Scoreboard" />
    <meta name="description" content="Weekly store performance scoreboard." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Store Scoreboard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #F4F6F8; color: #142A4A; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
      #boot-msg { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #142A4A; }
      #boot-errors { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 99999; max-height: 50vh; overflow: auto; background: #fff0f0; color: #8a1020; border: 2px solid #c0182c; border-radius: 8px; padding: 10px; font: 12px/1.4 -apple-system, system-ui, sans-serif; white-space: pre-wrap; word-break: break-word; }
    </style>
    <script>
      // iPhone app troubleshooting (2026-11-23): inside the app there are no
      // dev tools, so show page errors on screen. Only in the app
      // (window.Capacitor, injected before this runs) or with ?debug=1.
      (function () {
        var show = function () { return !!window.Capacitor || /[?&]debug=1/.test(location.search); };
        var report = function (msg) {
          if (!show()) return;
          var box = document.getElementById('boot-errors');
          if (!box) {
            if (!document.body) { document.addEventListener('DOMContentLoaded', function () { report(msg); }); return; }
            box = document.createElement('div'); box.id = 'boot-errors';
            box.textContent = 'Something went wrong. Screenshot this and send it to the dashboard admin:\n';
            document.body.appendChild(box);
          }
          box.textContent += '\n• ' + msg;
        };
        window.addEventListener('error', function (e) {
          if (e.target && e.target !== window && (e.target.src || e.target.href)) { report('Could not load ' + (e.target.src || e.target.href)); return; }
          report((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason; report('Promise: ' + (r && (r.stack || r.message) || r));
        });
        setTimeout(function () {
          if (document.getElementById('boot-msg')) report('The dashboard did not start after 20 seconds. ' + navigator.userAgent);
        }, 20000);
      })();
    </script>
  </head>
  <body>
    <noscript>JavaScript is required to run this app.</noscript>
    <div id="root"><div id="boot-msg">Loading dashboard…</div></div>
  </body>
</html>

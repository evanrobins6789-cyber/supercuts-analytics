# Codemagic builds the iPhone app on its Macs straight from this GitHub repo
# and uploads it to App Store Connect. Setup steps: IOS_APP_GUIDE.md.
workflows:
  ios-app-store:
    name: iPhone app -> App Store Connect
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The name you gave the App Store Connect API key in Codemagic
      # (Team settings -> Integrations -> Developer Portal). Must match exactly.
      app_store_connect: App Store Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.robinsdashboard.app
      node: 22
      xcode: latest
    triggering:
      events: []   # manual "Start new build" only; pushes to main don't rebuild the app
    scripts:
      - name: Install packages
        script: npm install --no-audit --no-fund
      - name: Sync the Capacitor iOS project
        script: npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the .ipa
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
